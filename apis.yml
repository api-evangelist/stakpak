aid: stakpak
name: StakPak
description: >-
  Stakpak is an open-source autonomous DevOps AI agent, distributed as a single Rust binary, that
  runs 24/7 on your machines to keep applications running — performing health checks, auto-healing
  failures, monitoring cloud cost, rotating secrets, renewing certificates, and alerting teams only
  when human intervention is needed ("all the upside of a PaaS, none of the lock-in"). It ships as a
  CLI with an interactive TUI, an autopilot daemon, an MCP server, and an ACP endpoint, backed by a
  hosted REST API (apiv2.stakpak.dev) covering accounts, organizations, agent sessions and
  checkpoints, a knowledge/memory store, rulebooks, the Paks knowledge registry, and an
  OpenAI-compatible chat-completion endpoint. Surfaced originally as a 500 Global portfolio company.
